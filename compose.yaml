  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Which module's jar goes into this image. One Dockerfile, five images - see its header.
        SERVICE: order-service

    depends_on:
      postgres:
        # Not just "started" - "started and answering". The default (service_started) is what makes
        # people add sleeps to entrypoints.
        condition: service_healthy
      kafka:
        # This service speaks to the broker, so a broker that is not answering yet means a first
        # order whose event goes nowhere. Waiting for healthy rather than started is what makes the
        # first order after `up` behave like the hundredth.
        condition: service_healthy
      # service_started, NOT service_healthy - and the difference is the whole argument.
      #
      # Checkout cannot price a cart without catalog-service, so the instinct is to wait for it. But
      # depends_on only orders STARTUP: it does nothing at runtime, and if catalog-service falls over
      # an hour later order-service keeps running and checkouts fail with a 409 that says so. The
      # runtime dependency is handled in code - timeouts, translated errors, a compensating release -
      # and that handling is what actually matters.
      #
      # What waiting for `healthy` buys is that the FIRST checkout after `up` cannot fail. What it
      # costs is that startup becomes serial: five cold JVMs on a contended VM, each waiting for the
      # last, and `up` aborts entirely if any one of them is slow. Measured here, that was the
      # difference between a stack that starts and one that reports "dependency failed to start" for
      # a service that was working perfectly and had simply not finished yet.
      #
      # Depending on `started` is the honest expression of the design: this service is built to
      # tolerate its neighbours being absent, so it should not refuse to boot without them.
