# The whole system: the application and the database it needs, started together.
#
# `docker compose up` replaces every manual step the README has accumulated since Phase 4 - no
# `docker run` to remember, no locally installed PostgreSQL, no waiting to see whether the database
# was ready before starting the app.

name: ecomdemo

services:

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecomdemo}
      POSTGRES_USER: ${POSTGRES_USER:-ecomdemo}
      # :? means compose refuses to start and prints this message if the variable is unset. Better
      # than a default: a password nobody chose is a password everybody knows.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - copy .env.example}"

    volumes:
      # A named volume, managed by Docker and living outside the container's writable layer.
      #
      # Everything a container writes to its own filesystem dies with the container, and `docker
      # compose down` deletes containers. The database would be empty every morning. The volume
      # survives down/up, image rebuilds and upgrades of the postgres image; only `down -v` removes
      # it, which is exactly the "and I mean it" switch.
      #
      # The path matters: PostgreSQL 18 declares /var/lib/postgresql, not the /var/lib/postgresql/data
      # that every older example uses. Mounting the old path succeeds and silently persists nothing.
      - pgdata:/var/lib/postgresql

    # No published port. The application reaches this database over the compose network, not through
    # the host - see the app's POSTGRES_URL below. Publishing it would also collide with the
    # standalone container from Phase 4 if that is still running. To inspect it from DBeaver, add:
    #   ports: ["5432:5432"]
    healthcheck:
      # pg_isready asks the server whether it is accepting connections. The point is the app's
      # depends_on below: without it, compose starts both at once, the application wins the race,
      # Flyway cannot connect, and the container exits before PostgreSQL has finished initialising.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecomdemo} -d ${POSTGRES_DB:-ecomdemo}"]
      interval: 5s
      timeout: 3s
      retries: 10
      # A first start initialises the data directory, which takes a moment. Failures during this
      # window do not count against `retries`.
      start_period: 15s

    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # No published port. The application reaches it as `redis` on the compose network, exactly as it
    # reaches `postgres` - nothing outside the stack needs it. To poke around with redis-cli:
    #   docker compose exec redis redis-cli
    command:
      # A cache must be allowed to forget things. maxmemory plus an eviction policy is what turns
      # Redis from "a datastore that will eventually refuse writes" into "a cache that discards what
      # has not been used lately": allkeys-lru evicts the least recently used key of any kind once
      # the limit is reached, which is the right policy when every key is disposable.
      #
      # Without this, a full Redis starts returning OOM errors on writes instead of making room, and
      # a cache that fails writes is worse than no cache.
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      # No persistence: everything here can be rebuilt from PostgreSQL, so writing it to disk buys
      # nothing and costs I/O. This is also why redis has no volume while postgres does.
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      postgres:
        # Not just "started" - "started and answering". This is the single most valuable line in the
        # file, and the default (service_started) is what makes people add sleeps to entrypoints.
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        # The application publishes on checkout and consumes into the notification table, so a
        # broker that is not answering yet means a checkout whose event goes nowhere. Waiting for
        # healthy rather than started is what makes the first order after `up` behave like the
        # hundredth.
        condition: service_healthy

    environment:
      # postgres, not localhost.
      #
      # Every container gets its own network namespace, so localhost inside this container is this
      # container - there is no database there. Compose puts both services on one network and runs a
      # DNS server that resolves each service name to its container's address, so `postgres` is the
      # hostname and 5432 is the port *inside* that container, published or not.
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ecomdemo}
      POSTGRES_USER: ${POSTGRES_USER:-ecomdemo}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - copy .env.example}"

      # redis, not localhost - the same container-networking rule as the database.
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"

      # kafka, not localhost - and 9092 is the port inside that container, which is not published.
      # This is the bootstrap address only: the client asks it which broker leads which partition
      # and is answered with the ADVERTISED_LISTENERS value, so both names have to resolve on this
      # network.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # Without this the application generates a random signing key on every start, so every restart
      # invalidates every token that was issued before it (Phase 9).
      # Quoted: the message contains ": ", and an unquoted YAML scalar containing that
      # is parsed as a mapping.
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env - generate one with openssl rand -base64 48}"

    ports:
      # host:container. The only port this system exposes to the outside world.
      - "8080:8080"

    # A memory limit, so -XX:MaxRAMPercentage in the Dockerfile has something to be a percentage of.
    # Unlimited is the default, and then the JVM sizes its heap against the whole host.
    deploy:
      resources:
        limits:
          memory: 768M

    healthcheck:
      # The readiness probe, now that Phase 15 has one.
      #
      # This is a better question than the old GET /api/products. That asked "can you serve a
      # request?" and answered it by doing real work; this asks the application itself whether it
      # considers itself able to take traffic, and the readiness group is defined to include the
      # database and Redis. A 503 here means the app is running but cannot serve - exactly the state
      # compose should not call healthy.
      #
      # Liveness is deliberately NOT used here: it excludes dependencies by design, so it would
      # report healthy while the database was unreachable.
      #
      # wget comes from busybox in the Alpine base - no extra package, and no curl in the image.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      # Generous: a cold JVM plus Flyway migrations on a new database.
      start_period: 45s

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.5
    # The LTS line. Pinned to an exact patch: `latest` means the stack you debug on Monday is not
    # the stack you deployed on Friday.

    # Read-only mounts: Prometheus reads its configuration and never writes to it. If a future
    # change needs a writable path, give it one rather than dropping the :ro.
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - promdata:/prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 7 days. Prometheus is for recent operational questions, not for a data warehouse - long
      # retention is what remote-write and a different system exist for.
      - --storage.tsdb.retention.time=7d
      # Lets `curl -X POST .../-/reload` pick up a rules change without restarting the container.
      - --web.enable-lifecycle

    ports:
      # Published so you can look at the targets page and the alert while learning. In a real
      # deployment this stays on the internal network and only Grafana talks to it.
      - "9090:9090"

    depends_on:
      app:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2

    environment:
      # No default. Same reasoning as POSTGRES_PASSWORD: a password nobody chose is a password
      # everybody knows, and Grafana's out-of-the-box admin/admin is the most guessed pair there is.
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env - copy .env.example}"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER:-admin}"
      # Anonymous viewing is off. This is a learning stack, but the dashboard reports real traffic
      # and turning it on is the kind of default that survives into somewhere it should not.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Nothing here needs to phone home.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"

    volumes:
      # Provisioning: the data source and the dashboard come from files in this repository, so a
      # fresh volume - or a fresh machine - comes up with the dashboard already there. Anything
      # clicked into Grafana's UI lives only in gfdata and is invisible to everyone else.
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - gfdata:/var/lib/grafana

    ports:
      - "3000:3000"

    depends_on:
      prometheus:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

    restart: unless-stopped

  kafka:
    # The official Apache image, pinned to the same version as the kafka-clients the application
    # compiles against. A broker and a client from different major lines usually interoperate, but
    # "usually" is not a thing to discover during a demo.
    image: apache/kafka:4.2.1

    environment:
      # --- KRaft ------------------------------------------------------------
      #
      # KRaft replaces ZooKeeper. Kafka used to need a second distributed system to remember which
      # brokers existed and who led each partition; since 4.0 that metadata lives in Kafka itself,
      # in an internal log managed by a Raft quorum. One system to run, one to upgrade, one to
      # understand - and this stack has no zookeeper service at all as a result.
      #
      # This single container plays both roles. `controller` is the metadata quorum member,
      # `broker` is the thing that actually stores partitions. Splitting them onto separate nodes
      # is the production shape; combining them is supported and is what a single-node learning
      # stack wants.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # id@host:port of every controller. One voter, which is itself.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # --- Listeners --------------------------------------------------------
      #
      # Two listeners on two ports, and the distinction matters: 9092 carries client traffic,
      # 9093 carries the Raft metadata votes. LISTENERS is what the broker binds; ADVERTISED_LISTENERS
      # is the address it hands back to clients so they can reach the partition leader directly.
      #
      # That second one is the classic Kafka trap. A client's first connection is only to ask "who
      # leads what?"; every later connection goes to the advertised address. Advertise `localhost`
      # here and the app container would be told to connect to itself. It says `kafka` for the same
      # reason POSTGRES_URL says `postgres`.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # --- Single-broker overrides -----------------------------------------
      #
      # These three default to 3, because Kafka's defaults assume a real cluster. On one broker a
      # topic that needs three replicas can never become available, and the failure is not a clean
      # error: __consumer_offsets is created lazily on the first commit, so the broker starts
      # perfectly, the app connects perfectly, and the first consumer group hangs.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Default is 3000ms of deliberate waiting, so a starting group can gather its members before
      # assigning partitions. Sensible with a rolling fleet, pure latency with one consumer.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # The image defaults this to /tmp/kraft-combined-logs, which is inside the container's
      # writable layer and therefore deleted with the container. /var/lib/kafka/data exists in the
      # image already, owned by the non-root appuser, so a named volume mounted there inherits that
      # ownership and the broker can write to it.
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # The identity of this Kafka cluster, stamped into the log directory when it is first
      # formatted. It has to stay the same across restarts or the broker refuses to open a data
      # directory that belongs to a different cluster. The image has a default, but pinning it here
      # means the volume survives an image upgrade that changes that default.
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw

    volumes:
      # The commit log - the messages themselves, the consumer offsets, and the KRaft metadata.
      # Unlike redis above, this one gets a volume: Kafka is a log, not a cache. Dropping it loses
      # every event that has not been consumed yet and resets every consumer group to the beginning.
      - kafkadata:/var/lib/kafka/data

    # No published port, the same rule as postgres and redis: the app reaches it as `kafka` on the
    # compose network. Use kafka-ui below to look inside, or:
    #   docker compose exec kafka /opt/kafka/bin/kafka-console-consumer.sh \
    #     --bootstrap-server localhost:9092 --topic orders.placed --from-beginning
    #
    # Publishing 9092 would not work the way it looks anyway - ADVERTISED_LISTENERS says `kafka`,
    # which a host-side client cannot resolve. Reaching a broker from both inside and outside a
    # container network takes a second listener, which this stack does not need.

    healthcheck:
      # Asks the broker to list its topics, which means the API is actually answering - a TCP port
      # accepts connections well before the broker has finished loading its log.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      # Formatting the log directory on a first start, plus a JVM.
      start_period: 30s

    restart: unless-stopped

  kafka-ui:
    # kafbat's fork, which is the maintained one - provectuslabs/kafka-ui has been archived since
    # 2023 and its last tag predates KRaft-only Kafka entirely.
    image: ghcr.io/kafbat/kafka-ui:v1.5.0

    environment:
      KAFKA_CLUSTERS_0_NAME: ecomdemo
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"

    ports:
      # 8081, because the application already owns 8080. Read-only inspection: topics, partitions,
      # offsets, consumer-group lag, and the messages themselves - including whatever is sitting in
      # the dead-letter topic.
      - "8081:8080"

    depends_on:
      kafka:
        condition: service_healthy

    restart: unless-stopped


volumes:
  pgdata:
  # Prometheus's time-series database. Losing it loses history, not configuration - the scrape
  # config and the rules are files in the repository.
  promdata:
  # Grafana's own database: users, preferences, and anything created through the UI. The data source
  # and dashboard are provisioned from files, so this volume is not where they live.
  gfdata:
  # Kafka's commit log, its consumer offsets and the KRaft metadata log. `docker compose down`
  # keeps it; `down -v` resets the cluster to empty and every consumer group to offset zero.
  kafkadata:
