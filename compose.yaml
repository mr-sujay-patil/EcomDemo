      # per-request dependency on customer-service, and this service keeps authorizing requests for
      # as long as it is up even if customer-service is not.
      JWKS_URI: http://customer-service:8081/.well-known/jwks.json

      # kafka, not localhost - and 9092 is the port inside that container, which is not published.
      # This is the bootstrap address only: the client asks it which broker leads which partition and
      # is answered with the ADVERTISED_LISTENERS value, so both names have to resolve on this network.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # Where the neighbours live. Service names on the compose network, resolved by compose's DNS -
      # which is all the service discovery this stack needs, and stops being enough the moment there
      # is more than one instance of catalog-service to choose between.
      CATALOG_BASE_URL: http://catalog-service:8082
      INVENTORY_BASE_URL: http://inventory-service:8083

    ports:
      # host:container, and the same number on both sides so the URLs in the README are the URLs
      # inside the network too. Published only until Phase 21 puts a gateway in front of everything.
      - "8084:8084"

    deploy:
      resources:
        limits:
          # A little more than the others: this is the only service that makes outbound HTTP calls,
          # so it carries a connection pool and the JSON of whatever its neighbours returned. See any
          # other service for why these numbers are as small as they are.
          memory: 384M

    healthcheck:
