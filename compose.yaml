      # in this stack - PostgreSQL cannot join or transact across databases, so the boundary holds
      # whatever the application code tries to do.
      POSTGRES_URL: jdbc:postgresql://postgres:5432/ecomdemo_catalog
      POSTGRES_USER: ${POSTGRES_USER:-ecomdemo}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - copy .env.example}"

      # Where this service fetches the public key it validates tokens with.
