# The whole system: five services, the infrastructure they need, started together.
#
# WHAT PHASE 20 CHANGED
#
# `app` is gone. In its place are five services on ports 8081-8085, each with its own image built
# from the same parameterised Dockerfile, its own database on the shared PostgreSQL server, and its
# own environment. Port 8080 is deliberately unused - it belonged to the monolith and will belong to
# the API gateway in Phase 21.
#
# The observability stack (prometheus, grafana, kafka-ui) sits behind a compose PROFILE, so the
# default `up` starts what the purchase flow needs and nothing else:
#
#   docker compose up -d --build                          # 8 containers: 5 services + postgres, redis, kafka
#   docker compose --profile observability up -d --build  # 11 containers, with Phase 15's dashboard
#
# That is not tidiness. Phase 17 measured this Docker VM at 4.1 GB and found Kafka thrashing at 428%
# CPU when four unconstrained JVMs shared it; there are now six JVMs in the default set and nine with
# observability on. Every one of them has a memory limit for that reason, and -XX:MaxRAMPercentage in
# the Dockerfile is what turns a limit into a heap ceiling.

name: ecomdemo

services:

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecomdemo}
      POSTGRES_USER: ${POSTGRES_USER:-ecomdemo}
      # :? means compose refuses to start and prints this message if the variable is unset. Better
      # than a default: a password nobody chose is a password everybody knows.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - copy .env.example}"

    volumes:
      # One database per service, created the first time this volume is initialised. Scripts here run
      # only when the data directory is empty, so changing the script later means `down -v`.
      #
      # This mount is where "database per service" stops being a convention: PostgreSQL cannot join
      # or transact across databases, so the boundary is enforced by the engine rather than by code
      # review. See the script for why five databases rather than five containers.
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro

      # A named volume, managed by Docker and living outside the container's writable layer.
      #
      # Everything a container writes to its own filesystem dies with the container, and `docker
      # compose down` deletes containers. The database would be empty every morning. The volume
      # survives down/up, image rebuilds and upgrades of the postgres image; only `down -v` removes
      # it, which is exactly the "and I mean it" switch.
      #
      # The path matters: PostgreSQL 18 declares /var/lib/postgresql, not the /var/lib/postgresql/data
      # that every older example uses. Mounting the old path succeeds and silently persists nothing.
      - pgdata:/var/lib/postgresql

    # No published port. The services reach this database over the compose network, not through the
    # host. To inspect it from DBeaver, add:
    #   ports: ["5432:5432"]
    #
    # To look at one service's data:
    #   docker compose exec postgres psql -U ecomdemo -d ecomdemo_order -c '\\dt'
    healthcheck:
      # pg_isready asks the server whether it is accepting connections. The point is the app's
      # depends_on below: without it, compose starts both at once, the application wins the race,
      # Flyway cannot connect, and the container exits before PostgreSQL has finished initialising.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecomdemo} -d ${POSTGRES_DB:-ecomdemo}"]
      interval: 5s
      timeout: 3s
      retries: 10
      # A first start initialises the data directory, which takes a moment. Failures during this
      # window do not count against `retries`.
      start_period: 15s

    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # No published port. The application reaches it as `redis` on the compose network, exactly as it
    # reaches `postgres` - nothing outside the stack needs it. To poke around with redis-cli:
    #   docker compose exec redis redis-cli
    command:
      # A cache must be allowed to forget things. maxmemory plus an eviction policy is what turns
      # Redis from "a datastore that will eventually refuse writes" into "a cache that discards what
      # has not been used lately": allkeys-lru evicts the least recently used key of any kind once
      # the limit is reached, which is the right policy when every key is disposable.
      #
      # Without this, a full Redis starts returning OOM errors on writes instead of making room, and
      # a cache that fails writes is worse than no cache.
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      # No persistence: everything here can be rebuilt from PostgreSQL, so writing it to disk buys
      # nothing and costs I/O. This is also why redis has no volume while postgres does.
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  customer-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Which module's jar goes into this image. One Dockerfile, five images - see its header.
        SERVICE: customer-service

    depends_on:
      postgres:
        # Not just "started" - "started and answering". The default (service_started) is what makes
        # people add sleeps to entrypoints.
        condition: service_healthy

    environment:
      # postgres, not localhost.
      #
      # Every container gets its own network namespace, so localhost inside this container is this
      # container - there is no database there. Compose puts every service on one network and runs a
      # DNS server that resolves each service name to its container's address.
      #
      # Note the database NAME: each service has its own. That is the whole of database-per-service
      # in this stack - PostgreSQL cannot join or transact across databases, so the boundary holds
      # whatever the application code tries to do.
      POSTGRES_URL: jdbc:postgresql://postgres:5432/ecomdemo_customer
      POSTGRES_USER: ${POSTGRES_USER:-ecomdemo}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - copy .env.example}"

      # The RSA private key that signs every token in the system, PKCS#8 PEM.
      #
      # This replaced JWT_SECRET in Phase 20, and it is why this service is the only one holding a
      # secret at all. With HS256 the key that verifies a token is the key that signs one, so all
      # five would have needed it - and notification-service holding the means to mint an admin token
      # is not a system anybody should design. Only this service can sign now; the other four fetch
      # the public half from JWKS_URI.
      #
      # Unset, the service generates a keypair at startup and logs a warning, so a fresh clone works
      # with no setup. Generate a real one with:
      #   openssl genpkey -algorithm RSA -pkcs8 -pkeyopt rsa_keygen_bits:2048
      JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY:-}"

    ports:
      # host:container, and the same number on both sides so the URLs in the README are the URLs
      # inside the network too. Published only until Phase 21 puts a gateway in front of everything.
      - "8081:8081"

    deploy:
      resources:
        limits:
          # 320 MB, and the number was measured rather than guessed.
          #
          # Six JVMs on one Docker VM. The first version of this file gave each service 384 MB and
          # Kafka 1 GB, which totals 3.4 GB before postgres, redis and Docker's own overhead - on a
          # 3.8 GB VM. The stack came up, reported healthy, and then fell over under the first real
          # request: the broker could not answer its own 2-second heartbeat, fenced itself, and the
          # CPU storm that followed pushed catalog-service past order-service's 5-second read
          # timeout. A checkout failed with "Read timed out" pointing at a service that was perfectly
          # healthy.
          #
          # These services idle at 90-210 MB with -XX:MaxRAMPercentage=75, so 320 MB is roughly
          # double what they use and the total now leaves 1.4 GB of headroom. Phase 17 learned this
          # lesson with four JVMs; six is where it stops being a warning.
          memory: 320M

    healthcheck:
      # The readiness probe: does this service consider itself able to take traffic? It includes the
      # database. Liveness is deliberately NOT used here - it excludes dependencies by design, so it
      # would report healthy while the database was unreachable.
      #
      # wget comes from busybox in the Alpine base - no extra package, and no curl in the image.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      # Three minutes, and it needs to be.
      #
      # start_period is a grace window, not a delay: failures inside it do not count against
      # `retries`, and a service that is ready in 20 seconds is marked healthy in 20 seconds. Setting
      # it generously costs nothing and setting it tightly costs a lot.
      #
      # 60s was the monolith's value and it is not enough for five. `docker compose up` starts all
      # five cold JVMs at once - five Spring contexts, five Flyway runs, five Hibernate bootstraps
      # competing for the same cores - and on a contended 3.8 GB VM catalog-service was measured
      # taking 195 seconds to print "Started". With a 60s start_period plus five 10s retries, compose
      # declared it unhealthy at 110s and aborted the whole `up` with "dependency failed to start" -
      # for a service that was working perfectly and simply had not finished yet.
      start_period: 180s

    restart: unless-stopped

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Which module's jar goes into this image. One Dockerfile, five images - see its header.
        SERVICE: catalog-service

    depends_on:
