      #
      # start_period is a grace window, not a delay: failures inside it do not count against
      # `retries`, and a service that is ready in 20 seconds is marked healthy in 20 seconds. Setting
      # it generously costs nothing and setting it tightly costs a lot.
      #
      # 60s was the monolith's value and it is not enough for five. `docker compose up` starts all
      # five cold JVMs at once - five Spring contexts, five Flyway runs, five Hibernate bootstraps
      # competing for the same cores - and on a contended 3.8 GB VM catalog-service was measured
      # taking 195 seconds to print "Started". With a 60s start_period plus five 10s retries, compose
      # declared it unhealthy at 110s and aborted the whole `up` with "dependency failed to start" -
      # for a service that was working perfectly and simply had not finished yet.
      start_period: 180s

    restart: unless-stopped

  prometheus:
    # Behind a profile: `docker compose --profile observability up -d`.
    #
    # Phase 15's dashboard is not part of the purchase flow, and three more JVMs on a 4 GB Docker VM
    # that already runs six is the difference between a stack that idles and one that swaps. Opting
    # in costs one flag and is the honest default once the service count went from one to five.
    profiles: ["observability"]

    image: prom/prometheus:v3.5.5
    # The LTS line. Pinned to an exact patch: `latest` means the stack you debug on Monday is not
    # the stack you deployed on Friday.

    # Read-only mounts: Prometheus reads its configuration and never writes to it. If a future
    # change needs a writable path, give it one rather than dropping the :ro.
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - promdata:/prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 7 days. Prometheus is for recent operational questions, not for a data warehouse - long
      # retention is what remote-write and a different system exist for.
      - --storage.tsdb.retention.time=7d
      # Lets `curl -X POST .../-/reload` pick up a rules change without restarting the container.
      - --web.enable-lifecycle

    ports:
      # Published so you can look at the targets page and the alert while learning. In a real
      # deployment this stays on the internal network and only Grafana talks to it.
      - "9090:9090"

    # No depends_on any more. It used to wait for `app`; waiting for all five services would make
    # the monitoring stack unavailable exactly when it is most wanted - while something is failing to
    # start. Prometheus reports a target as down and carries on, which is what it is for.

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    restart: unless-stopped

  grafana:
    # Behind a profile: `docker compose --profile observability up -d`.
    #
    # Phase 15's dashboard is not part of the purchase flow, and three more JVMs on a 4 GB Docker VM
    # that already runs six is the difference between a stack that idles and one that swaps. Opting
    # in costs one flag and is the honest default once the service count went from one to five.
    profiles: ["observability"]

    image: grafana/grafana:13.2.2

    environment:
      # No default. Same reasoning as POSTGRES_PASSWORD: a password nobody chose is a password
      # everybody knows, and Grafana's out-of-the-box admin/admin is the most guessed pair there is.
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env - copy .env.example}"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER:-admin}"
      # Anonymous viewing is off. This is a learning stack, but the dashboard reports real traffic
      # and turning it on is the kind of default that survives into somewhere it should not.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Nothing here needs to phone home.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"

    volumes:
      # Provisioning: the data source and the dashboard come from files in this repository, so a
      # fresh volume - or a fresh machine - comes up with the dashboard already there. Anything
      # clicked into Grafana's UI lives only in gfdata and is invisible to everyone else.
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - gfdata:/var/lib/grafana

    ports:
      - "3000:3000"

    depends_on:
      prometheus:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

    restart: unless-stopped

  kafka:
    # The official Apache image, pinned to the same version as the kafka-clients the application
    # compiles against. A broker and a client from different major lines usually interoperate, but
    # "usually" is not a thing to discover during a demo.
    image: apache/kafka:4.2.1

    environment:
      # --- KRaft ------------------------------------------------------------
      #
      # KRaft replaces ZooKeeper. Kafka used to need a second distributed system to remember which
      # brokers existed and who led each partition; since 4.0 that metadata lives in Kafka itself,
      # in an internal log managed by a Raft quorum. One system to run, one to upgrade, one to
      # understand - and this stack has no zookeeper service at all as a result.
      #
      # This single container plays both roles. `controller` is the metadata quorum member,
      # `broker` is the thing that actually stores partitions. Splitting them onto separate nodes
      # is the production shape; combining them is supported and is what a single-node learning
      # stack wants.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # id@host:port of every controller. One voter, which is itself.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # --- Listeners --------------------------------------------------------
      #
      # Two listeners on two ports, and the distinction matters: 9092 carries client traffic,
      # 9093 carries the Raft metadata votes. LISTENERS is what the broker binds; ADVERTISED_LISTENERS
      # is the address it hands back to clients so they can reach the partition leader directly.
      #
      # That second one is the classic Kafka trap. A client's first connection is only to ask "who
      # leads what?"; every later connection goes to the advertised address. Advertise `localhost`
      # here and the app container would be told to connect to itself. It says `kafka` for the same
      # reason POSTGRES_URL says `postgres`.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # --- Single-broker overrides -----------------------------------------
      #
      # These three default to 3, because Kafka's defaults assume a real cluster. On one broker a
      # topic that needs three replicas can never become available, and the failure is not a clean
      # error: __consumer_offsets is created lazily on the first commit, so the broker starts
      # perfectly, the app connects perfectly, and the first consumer group hangs.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Default is 3000ms of deliberate waiting, so a starting group can gather its members before
      # assigning partitions. Sensible with a rolling fleet, pure latency with one consumer.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # The image defaults this to /tmp/kraft-combined-logs, which is inside the container's
      # writable layer and therefore deleted with the container. /var/lib/kafka/data exists in the
      # image already, owned by the non-root appuser, so a named volume mounted there inherits that
      # ownership and the broker can write to it.
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # The identity of this Kafka cluster, stamped into the log directory when it is first
      # formatted. It has to stay the same across restarts or the broker refuses to open a data
      # directory that belongs to a different cluster. The image has a default, but pinning it here
      # means the volume survives an image upgrade that changes that default.
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw

      # Cap the heap, for the same reason the app service has a memory limit: an unconstrained JVM
      # sizes its heap against the whole machine, and there are three other JVMs in this stack doing
      # the same. Kafka's start script defaults to -Xmx1G, which on a 4 GB Docker VM alongside the
      # application, Grafana and Kafka UI is enough to push the lot into GC thrash - the broker then
      # cannot answer its own broker-to-controller heartbeat inside its 2 second timeout, fences
      # itself, unloads all 50 __consumer_offsets partitions, and every consumer rejoins. That loop
      # presents as a broker pinned at 400% CPU with an empty topic, which looks like anything but a
      # memory problem.
      #
      # 320m, down from 512m in Phase 17, because there are now five application JVMs beside it
      # rather than one. Kafka does its real work in the page cache, which is off-heap, so a single
      # broker holding a few thousand small records is not short of heap at this size - and an -Xms
      # equal to -Xmx commits the whole amount immediately, which is memory taken from everything
      # else whether the broker needs it or not.
      KAFKA_HEAP_OPTS: -Xms256m -Xmx320m

    # Room for the heap above plus the JVM's own overhead and page cache.
    deploy:
      resources:
        limits:
          memory: 640M

    volumes:
      # The commit log - the messages themselves, the consumer offsets, and the KRaft metadata.
      # Unlike redis above, this one gets a volume: Kafka is a log, not a cache. Dropping it loses
      # every event that has not been consumed yet and resets every consumer group to the beginning.
      - kafkadata:/var/lib/kafka/data

    # No published port, the same rule as postgres and redis: the app reaches it as `kafka` on the
    # compose network. Use kafka-ui below to look inside, or:
    #   docker compose exec kafka /opt/kafka/bin/kafka-console-consumer.sh \
    #     --bootstrap-server localhost:9092 --topic orders.placed --from-beginning
    #
    # Publishing 9092 would not work the way it looks anyway - ADVERTISED_LISTENERS says `kafka`,
    # which a host-side client cannot resolve. Reaching a broker from both inside and outside a
    # container network takes a second listener, which this stack does not need.

    healthcheck:
      # Asks the broker to list its topics, which means the API is actually answering - a TCP port
      # accepts connections well before the broker has finished loading its log.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      # Formatting the log directory on a first start, plus a JVM - and, on a restart, loading all
      # 50 __consumer_offsets partitions before the broker will answer.
      #
      # 30s was enough when the broker had the machine mostly to itself. With five application JVMs
      # starting beside it, that load was measured taking well over a minute, and compose aborted
      # the entire `up` with "dependency failed to start" for a broker that was working through its
      # log exactly as designed.
      start_period: 150s

    restart: unless-stopped

  kafka-ui:
    # Behind a profile: `docker compose --profile observability up -d`.
    #
    # Phase 15's dashboard is not part of the purchase flow, and three more JVMs on a 4 GB Docker VM
    # that already runs six is the difference between a stack that idles and one that swaps. Opting
    # in costs one flag and is the honest default once the service count went from one to five.
    profiles: ["observability"]

    # kafbat's fork, which is the maintained one - provectuslabs/kafka-ui has been archived since
    # 2023 and its last tag predates KRaft-only Kafka entirely.
    image: ghcr.io/kafbat/kafka-ui:v1.5.0

    environment:
      KAFKA_CLUSTERS_0_NAME: ecomdemo
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
      # Kafka UI is a Spring Boot application, so it sizes its heap against the whole VM too. It is
      # a viewer for a handful of topics and does not need more than this.
      JAVA_OPTS: -Xms128m -Xmx256m

    ports:
      # 8086, NOT 8081. Phase 20 gave 8081 to customer-service, and a port collision in compose is a
      # container that exits with a one-line error most people scroll past.
      #
      # Read-only inspection: topics, partitions, offsets, consumer-group lag, and the messages
      # themselves - including whatever is sitting in the dead-letter topic.
      - "8086:8080"

    depends_on:
      kafka:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 512M

    restart: unless-stopped


volumes:
  pgdata:
  # Prometheus's time-series database. Losing it loses history, not configuration - the scrape
  # config and the rules are files in the repository.
  promdata:
  # Grafana's own database: users, preferences, and anything created through the UI. The data source
  # and dashboard are provisioned from files, so this volume is not where they live.
  gfdata:
  # Kafka's commit log, its consumer offsets and the KRaft metadata log. `docker compose down`
  # keeps it; `down -v` resets the cluster to empty and every consumer group to offset zero.
  kafkadata:
