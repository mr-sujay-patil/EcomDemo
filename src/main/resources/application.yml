# Settings shared by every profile. Anything database-specific lives in application-<profile>.yml,
# because from Phase 4 on the application runs against PostgreSQL but the tests still run against an
# embedded H2, and the two need different datasource and schema settings.
spring:
  application:
    name: ecomdemo

  # The profile used when nothing else is specified. The SPRING_PROFILES_ACTIVE environment variable
  # and --spring.profiles.active both override this, and @ActiveProfiles overrides it in tests.
  profiles:
    active: dev

  jpa:
    open-in-view: false            # no lazy loading during JSON serialisation - map to DTOs in the service
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          # Bind and read timestamps as UTC rather than in the JVM's default zone, so the same code
          # behaves identically on a laptop in IST and a server in UTC.
          #
          # PostgreSQL alone would not need this: Hibernate maps Order.placedAt (an Instant) to
          # TIMESTAMP_UTC, which it realises as `timestamp with time zone`, and that column stores an
          # unambiguous point in time. The setting earns its place because the test profile runs on
          # H2, where the mapping is not guaranteed to match - pinning the zone removes the machine
          # and the engine as variables at once.
          time_zone: UTC

  # Apache Kafka. Every setting here is shared by dev and test; the test profile only switches the
  # listeners off so `./mvnw test` still needs no broker.
  kafka:
    # Overridden by SPRING_KAFKA_BOOTSTRAP_SERVERS in compose. The local default matches a broker
    # published on the host, which is what a `docker run` of apache/kafka would give you.
    #
    # "Bootstrap" is literal: this address is used once, to ask the cluster for its full topology.
    # Everything after that goes straight to whichever broker leads the partition being read or
    # written, at the address that broker advertises. Listing every broker here is therefore not
    # required - it only buys resilience for that first call.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      # Wait for the leader AND every in-sync replica to have written the record before calling the
      # send successful.
      #
      # acks=1 (leader only) is the setting that quietly loses data: the leader acknowledges, then
      # fails before any follower has copied the record, and a follower that never saw it is
      # elected. acks=all is the difference between at-least-once and "at-least-once unless
      # something goes wrong", and the cost is a few milliseconds.
      acks: all

      # Keep trying. A retriable failure is usually a leader election in progress, which resolves in
      # seconds; failing the send instead would push a transient problem all the way up to checkout.
      retries: 10

      properties:
        # Retries alone can duplicate: the broker may have written the record and lost the network
        # before acknowledging, so the client retries something already stored. The idempotent
        # producer gives each producer a session id and each record a sequence number, and the
        # broker discards a duplicate it has already seen.
        #
        # This is exactly-once semantics *for the write*, and it is worth being clear about how far
        # that reaches: it removes duplicates caused by producer retries, and nothing else. An
        # application that publishes the same order twice still publishes it twice, which is why
        # the consumer is idempotent as well.
        enable.idempotence: true

        # How long send() may block waiting for cluster metadata before giving up. The default is
        # 60 seconds, and it is a blocking wait on the calling thread - with a broker down, every
        # checkout would hang for a minute before the event failed. 5 seconds is long enough to ride
        # out a leader election and short enough that a real outage degrades rather than freezes.
        max.block.ms: 5000

    consumer:
      # The consumer group. Kafka divides a topic's partitions among the members of a group, so
      # running a second instance of this application does not double-deliver anything - it takes
      # over some of the partitions. Two *different* group ids would each get every message, which
      # is how independent features subscribe to the same topic.
      group-id: ecomdemo-notifications

      # Where a brand new group starts. `earliest` replays the topic from the beginning; `latest`
      # (the default) would silently skip every event published before the consumer first started,
      # which on a fresh stack means the ones you just produced while testing.
      auto-offset-reset: earliest

      # Do not commit offsets on a timer.
      #
      # Auto-commit acknowledges records the consumer has *received*, not records it has finished
      # handling - a crash between the commit and the handler is a lost message, silently. Turning
      # it off hands the decision to the listener container, which commits after the listener method
      # returns normally. That is what makes the delivery at-least-once rather than at-most-once.
      enable-auto-commit: false

      # ErrorHandlingDeserializer wraps the real deserializer and catches what it throws.
      #
      # Without it a malformed message is not a failed record, it is a failed poll: the container
      # asks for the batch again, fails to deserialize again, and the partition stops moving
      # forever. No retry, no dead letter, no progress - just a log line every few seconds. This is
      # the single most important line in this block, and the failure it prevents looks like a hung
      # consumer rather than an error.
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer

        # The producer writes a __TypeId__ header naming the class it serialised. Trusting every
        # package would let whoever can write to the topic name any class on the classpath and have
        # Jackson construct it - the shape of several remote-code-execution bugs. An allow-list of
        # one package is the whole defence.
        spring.json.trusted.packages: com.ecomdemo.order.event

        # And when there is no header at all - a message hand-crafted with kafka-console-producer,
        # say - deserialize it as this. Without a default such a message fails, which is a fine
        # outcome, but a deliberate one is easier to reason about.
        spring.json.value.default.type: com.ecomdemo.order.event.OrderPlacedEvent

    listener:
      # Commit the offset after each record's listener method returns, rather than after a batch.
      #
      # Slower - one commit per message - and the right default here, because the unit of work is
      # one notification. With BATCH, a failure on the fourth record of a poll of ten re-delivers
      # all ten, and the idempotency table would be carrying weight it should not have to.
      ack-mode: record


# Everything this application needs to sign and verify its own tokens.
ecomdemo:
  jwt:
    # No default and nothing committed. When it is unset the application generates a random key at
    # startup and logs a warning: a fresh clone works immediately, and tokens simply do not survive a
    # restart - which is honest, because the key that signed them is gone.
    #
    # Generate a real one with:  openssl rand -base64 48
    secret: ${JWT_SECRET:}

    # Short, because a JWT cannot be withdrawn once issued. The window in which a stolen or stale
    # token still works is exactly its remaining lifetime.
    expiry: 15m

# Actuator: what the outside world may ask this application about itself.
#
# Everything here is deny-by-default in the same spirit as the security rules. Actuator ships around
# two dozen endpoints; exposure is an explicit allow-list, and the default is `health` alone.
management:
  endpoints:
    web:
      exposure:
        # The four this phase needs, and nothing else. /actuator/env and /actuator/beans in
        # particular are reconnaissance aids - env prints resolved configuration, which is where
        # connection strings live.
        include: health,info,metrics,prometheus

  endpoint:
    health:
      # Anonymous callers get {"status":"UP"} and nothing more. An administrator gets the component
      # breakdown. The breakdown names the database and Redis and reports their state, which tells
      # an attacker what to aim at and when it is already struggling.
      show-details: when-authorized
      roles: ADMIN

      group:
        # Liveness answers one question: "is this process broken beyond recovery?" The only cure for
        # a NO is a restart, so the group deliberately contains NOTHING but the application's own
        # state - no database, no Redis.
        #
        # Wiring a dependency in here is a classic and expensive mistake: a database blip would make
        # every instance report itself dead, the orchestrator would restart all of them at once, and
        # a brief outage becomes a total one. The database does not get better because the
        # application was restarted.
        liveness:
          include: livenessState

        # Readiness answers a different question: "should traffic be sent here right now?" A NO
        # removes the instance from the load balancer and leaves it running, so depending on
        # infrastructure is exactly right - an instance that cannot reach PostgreSQL can serve
        # nothing useful and should stop being asked to.
        readiness:
          include: readinessState,db,redis

  health:
    # Off by default outside Kubernetes, and without it neither livenessState nor readinessState
    # exists as an indicator - the two groups above would then fail startup, because
    # management.endpoint.health.validate-group-membership defaults to true and refuses to build a
    # group out of indicators that are not there. That validation is worth keeping: a typo in a
    # group would otherwise produce a group that silently checks nothing and always says UP.
    probes:
      enabled: true

  metrics:
    distribution:
      # Ship a histogram, not a pre-computed average, for these two timers.
      #
      # An average latency hides everything worth knowing - it is dominated by the fast majority and
      # says nothing about the slow tail users actually complain about. A histogram is a set of
      # bucket counters, which Prometheus can add up across instances, so p95 for the whole service
      # is computable from the parts. Percentiles calculated per-instance cannot be averaged
      # together and are wrong the moment there is more than one replica.
      percentiles-histogram:
        http.server.requests: true
        order.checkout: true

server:
  error:
    include-stacktrace: never

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace   # shows the values bound to '?' placeholders in the SQL above
    # HIT / MISS / PUT / EVICT for every cache operation. On by default here because watching the
    # second read not reach the database is the whole point of Phase 13; a real deployment would
    # leave this at INFO.
    com.ecomdemo.cache: debug
