# Settings shared by every profile. Anything database-specific lives in application-<profile>.yml,
# because from Phase 4 on the application runs against PostgreSQL but the tests still run against an
# embedded H2, and the two need different datasource and schema settings.
spring:
  application:
    name: ecomdemo

  # The profile used when nothing else is specified. The SPRING_PROFILES_ACTIVE environment variable
  # and --spring.profiles.active both override this, and @ActiveProfiles overrides it in tests.
  profiles:
    active: dev

  jpa:
    open-in-view: false            # no lazy loading during JSON serialisation - map to DTOs in the service
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          # Write timestamps in UTC rather than the JVM's default zone. Order.placedAt is an Instant,
          # which Hibernate maps to `timestamp(6)` - a column with no zone attached. Without this the
          # stored value silently depends on the timezone of whichever machine wrote it.
          time_zone: UTC

server:
  error:
    include-stacktrace: never

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace   # shows the values bound to '?' placeholders in the SQL above
