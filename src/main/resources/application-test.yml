# The profile the test suite runs under (@ActiveProfiles("test")).
#
# Tests keep an embedded database so `./mvnw clean verify` needs no installed server and no network.
# MODE=PostgreSQL makes H2 accept PostgreSQL syntax and DATABASE_TO_LOWER mirrors PostgreSQL's habit
# of folding unquoted identifiers to lower case - which narrows, but does not close, the gap between
# what the tests exercise and what production runs. Phase 7 closes it properly with Testcontainers.
spring:
  datasource:
    url: jdbc:h2:mem:ecomdemo-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # No cache in the fast suite.
  #
  # Unit and slice tests are about behaviour, not about caching, and requiring a Redis for them would
  # undo Phase 7's rule that `./mvnw test` needs no Docker. NoOpCacheManager means every @Cacheable
  # method simply runs - which is also the honest way to test the logic underneath a cache.
  # ProductCacheIT turns caching back on against a real Redis container.
  cache:
    type: none

  jpa:
    hibernate:
      # The same validate as dev, against a schema the same migrations built. The test suite now
      # proves the migrations run and that the entities match what they produce - a broken migration
      # fails `./mvnw clean verify` instead of a deployment.
      ddl-auto: validate

  # @DataJpaTest would otherwise swap this datasource for a plain embedded one, whose URL carries no
  # MODE=PostgreSQL - and the migrations would then run against different SQL dialect rules than the
  # ones they are written for. Keeping the configured datasource keeps every test on one engine.
  test:
    database:
      replace: none

  # No broker in the fast suite.
  #
  # Three existing tests are full @SpringBootTest contexts on H2, and a Kafka auto-configuration
  # that tried to reach a broker would turn `./mvnw test` into something that needs Docker - which
  # Phase 7 established it must not. Each of these switches off a different thing that would
  # otherwise connect at startup:
  kafka:
    # Nothing listens here. Explicit rather than inherited, so a test that does reach a broker is
    # obviously reaching the wrong one.
    bootstrap-servers: localhost:1
    listener:
      # The listener containers are not started, so no consumer ever polls. Without this the
      # container threads retry a dead broker for the length of the build, logging as they go.
      auto-startup: false
    admin:
      # KafkaAdmin creates the NewTopic beans at context refresh. auto-create false means it never
      # opens an AdminClient, so the retry and dead-letter topics @RetryableTopic declares are not
      # attempted either.
      auto-create: false
    producer:
      properties:
        # The publisher is called for real by OrderRetryTest and OrderAuditRollbackTest, which place
        # orders. send() blocks waiting for cluster metadata; 250ms keeps that from being the
        # slowest thing in the suite. The failure is caught and logged - a checkout that has already
        # committed must not be undone because a broker is unreachable.
        max.block.ms: 250
