# inventory-service against its own PostgreSQL database.
#
# No Redis anywhere in this file, and that is the design rather than an omission. Every number this
# service returns feeds a decision - "is there enough?" - and Phase 13's rule was to cache what is
# read to be displayed and never what is read to make a decision. Having no cache dependency at all
# is the strongest form of that rule: it cannot be broken here by someone adding an annotation.
spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/ecomdemo_inventory}
    username: ${POSTGRES_USER:ecomdemo}
    password: ${POSTGRES_PASSWORD:ecomdemo}

    hikari:
      pool-name: InventoryServicePool
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
