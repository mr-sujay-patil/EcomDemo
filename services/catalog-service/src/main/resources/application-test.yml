# The profile the test suite runs under (@ActiveProfiles("test")).
spring:
  datasource:
    url: jdbc:h2:mem:catalog-service-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # No cache in the fast suite: requiring a Redis for unit and slice tests would undo Phase 7's rule
  # that `./mvnw test` needs no Docker. NoOpCacheManager means every @Cacheable method simply runs,
  # which is also the honest way to test the logic underneath a cache. ProductCacheIT turns caching
  # back on against a real Redis container.
  cache:
    type: none

  test:
    database:
      replace: none
