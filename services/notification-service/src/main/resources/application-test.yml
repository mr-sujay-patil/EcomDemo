# The profile the test suite runs under (@ActiveProfiles("test")).
spring:
  datasource:
    url: jdbc:h2:mem:notification-service-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  test:
    database:
      replace: none

  # No broker in the fast suite, so `./mvnw test` still needs no Docker.
  kafka:
    bootstrap-servers: localhost:1
    listener:
      # The listener containers are not started, so no consumer ever polls. Without this the
      # container threads retry a dead broker for the length of the build, logging as they go.
      auto-startup: false
    admin:
      # KafkaAdmin creates topics at context refresh. auto-create false means it never opens an
      # AdminClient, so the retry and dead-letter topics @RetryableTopic declares are not attempted.
      auto-create: false
