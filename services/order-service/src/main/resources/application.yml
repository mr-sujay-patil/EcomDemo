# order-service: carts, checkout and orders.
#
# The only service that calls other services, which is why this is the longest of the five
# configuration files: two client base URLs, a Kafka producer, and the JWKS endpoint.
spring:
  application:
    name: order-service

  profiles:
    active: dev

  config:
    import: "classpath:ecomdemo-defaults.yml"

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}

  # Apache Kafka. Every setting here is shared by dev and test; the test profile only switches the
  # listeners off so `./mvnw test` still needs no broker.
  kafka:
    # Overridden by SPRING_KAFKA_BOOTSTRAP_SERVERS in compose. The local default matches a broker
    # published on the host, which is what a `docker run` of apache/kafka would give you.
    #
    # "Bootstrap" is literal: this address is used once, to ask the cluster for its full topology.
    # Everything after that goes straight to whichever broker leads the partition being read or
    # written, at the address that broker advertises. Listing every broker here is therefore not
    # required - it only buys resilience for that first call.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # JacksonJsonSerializer, not JsonSerializer.
      #
      # Spring Kafka 4.1 ships both, and the difference is which Jackson they use: JsonSerializer is
      # the Jackson 2 one (com.fasterxml.jackson), Jackson* is the Jackson 3 one (tools.jackson) that
      # Spring Boot 4 standardised on. It matters immediately - Jackson 2 refuses to serialize
      # java.time.Instant without the JSR-310 module registered, and OrderPlacedEvent.placedAt is an
      # Instant, so the older pair fails at the first checkout with "Java 8 date/time type not
      # supported by default". Jackson 3 handles it out of the box.
      #
      # Same trap as tools.jackson vs com.fasterxml.jackson in the test sources: every example
      # written before Boot 4 names the class that no longer works here.
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

      # Wait for the leader AND every in-sync replica to have written the record before calling the
      # send successful.
      #
      # acks=1 (leader only) is the setting that quietly loses data: the leader acknowledges, then
      # fails before any follower has copied the record, and a follower that never saw it is
      # elected. acks=all is the difference between at-least-once and "at-least-once unless
      # something goes wrong", and the cost is a few milliseconds.
      acks: all

      # Keep trying. A retriable failure is usually a leader election in progress, which resolves in
      # seconds; failing the send instead would push a transient problem all the way up to checkout.
      retries: 10

      properties:
        # Retries alone can duplicate: the broker may have written the record and lost the network
        # before acknowledging, so the client retries something already stored. The idempotent
        # producer gives each producer a session id and each record a sequence number, and the
        # broker discards a duplicate it has already seen.
        #
        # This is exactly-once semantics *for the write*, and it is worth being clear about how far
        # that reaches: it removes duplicates caused by producer retries, and nothing else. An
        # application that publishes the same order twice still publishes it twice, which is why
        # the consumer is idempotent as well.
        enable.idempotence: true

        # How long send() may block waiting for cluster metadata before giving up. The default is
        # 60 seconds, and it is a blocking wait on the calling thread - with a broker down, every
        # checkout would hang for a minute before the event failed. 5 seconds is long enough to ride
        # out a leader election and short enough that a real outage degrades rather than freezes.
        max.block.ms: 5000


server:
  port: 8084

ecomdemo:
  clients:
    # Where the neighbours live. Service names on the compose network; localhost ports when running
    # services by hand. Nothing in com.ecomdemo.order.client knows either - see
    # ServiceClientsConfiguration.
    #
    # This is the whole of "service discovery" in Phase 20, and it is enough because compose's DNS
    # resolves a service name to its container. It stops being enough the moment there is more than
    # one instance of catalog-service and something has to choose between them.
    catalog:
      base-url: ${CATALOG_BASE_URL:http://localhost:8082}
    inventory:
      base-url: ${INVENTORY_BASE_URL:http://localhost:8083}

# Resilience4j: what happens when a neighbour is slow or down.
#
# Every number here is a trade-off rather than a default, and the comments say which way.
resilience4j:
  circuitbreaker:
    instances:
      # Guards order-service -> catalog-service.
      catalog:
        # COUNT_BASED: decide on the last N calls, not the last N seconds. On a low-traffic demo a
        # TIME_BASED window can hold two calls, and a "50% failure rate" computed from two calls is
        # noise. Count-based means the breaker needs real evidence before it acts.
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        # Do not judge before there is something to judge. Without this the first failed call is a
        # 100% failure rate and the circuit opens on one bad request.
        minimumNumberOfCalls: 5
        failureRateThreshold: 50

        # How long to stay open before letting anything through. Ten seconds so the demo in the
        # README is watchable; a real system would use longer, because the cost of probing too early
        # is that the recovering service gets traffic before it is ready.
        waitDurationInOpenState: 10s
        # Half-open automatically rather than waiting for a call to arrive - otherwise a service with
        # no traffic never discovers that its dependency came back.
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # Three probes decide it. All three must succeed, or it opens again.
        permittedNumberOfCallsInHalfOpenState: 3

        # A 4xx is an ANSWER, not a failure. Without this, a shopper asking for a product that does
        # not exist would push the breaker towards opening, and enough 404s would cut off a catalogue
        # that was working perfectly.
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException

        # NOT wired into the health endpoint, deliberately.
        #
        # An open circuit means MY NEIGHBOUR is down, not "stop sending me traffic". Wiring it to
        # readiness would remove order-service from the load balancer because catalog-service was
        # struggling - a cascading failure caused by the tool meant to prevent one. The same
        # liveness-vs-readiness lesson as Phase 15, in a new costume.
        registerHealthIndicator: false

  retry:
    instances:
      catalog:
        # Three attempts in total, not three retries after the first.
        maxAttempts: 3
        waitDuration: 200ms
        # Exponential: whatever is broken is usually either better almost immediately or not better
        # for a while, and a fixed interval helps neither case.
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        # Jitter, and this is the line that prevents a retry storm.
        #
        # Without it, every order-service instance that failed at the same moment retries at the same
        # moment. A dependency that fell over under load then gets a synchronised burst exactly as it
        # tries to recover, fails again, and the retries keep it down - the clients doing the most to
        # "help" being precisely what prevents recovery. Randomising the wait spreads the burst out.
        enableRandomizedWait: true
        randomizedWaitFactor: 0.5

        # Same reasoning as the breaker: a 404 is an answer and must not be retried. Retrying it
        # would triple the load for a question already answered.
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException

  bulkhead:
    instances:
      # Guards order-service -> inventory-service reservations. See ResilientInventoryClient for why
      # this call and not another.
      inventory:
        maxConcurrentCalls: 8
        # Reject immediately rather than queue. Queueing converts thread exhaustion into memory
        # exhaustion and adds latency to a request that is going to fail anyway.
        maxWaitDuration: 0

management:
  metrics:
    distribution:
      percentiles-histogram:
        # The checkout timer from Phase 15. It measures more than it used to: the same meter now
        # covers two HTTP calls to other services as well as the local database work, so its p95 is
        # the first place a slow neighbour shows up.
        order.checkout: true

  # The circuit breaker, retry and bulkhead meters reach /actuator/prometheus on their own:
  # resilience4j-micrometer comes with the starter and binds to whatever MeterRegistry exists. They
  # also pick up the application="order-service" common tag from shared-kernel, because that is a
  # MeterRegistryCustomizer applied to the registry rather than to individual meters.
  #
  # What IS switched off is the health contribution. An open circuit means my neighbour is down, not
  # "stop sending me traffic" - see registerHealthIndicator above for why letting it reach readiness
  # would turn one struggling dependency into a fleet-wide outage.
  health:
    circuitbreakers:
      enabled: false

